name: test
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  shebang:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/check-shebang.sh
      - run: tests/check-symlinks.sh
  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ansible-core and ansible-lint into a venv
        env:
          # renovate: datasource=pypi depName=ansible-core
          ANSIBLE_CORE_VERSION: 2.18.18
          # renovate: datasource=pypi depName=ansible-lint
          ANSIBLE_LINT_VERSION: 25.1.3
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "ansible-core==${ANSIBLE_CORE_VERSION}" "ansible-lint==${ANSIBLE_LINT_VERSION}"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Parse the whole role (tasks, handlers)
        working-directory: tests
        run: |
          ansible-playbook --syntax-check role.yml
          ansible-playbook --list-tasks role.yml
      - run: ansible-lint
